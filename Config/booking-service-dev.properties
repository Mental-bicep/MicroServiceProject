spring.application.name=booking-service


server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/kodewala
spring.datasource.username=root
spring.datasource.password=root
#spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:kodewala}
#spring.datasource.username=${DB_USER:root}
#spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


management.endpoints.web.exposure.include=* 
#management.endpoints.web.exposure.include=health,metrics

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Resilience4j Circuit Breaker configuration for 'paymentServiceCB'
resilience4j.circuitbreaker.instances.paymentServiceCB.registerWithHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentServiceCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentServiceCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.paymentServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.waitDurationInOpenState=20000ms
resilience4j.circuitbreaker.instances.paymentServiceCB.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.paymentServiceCB.automaticTransitionFromOpenToHalfOpenEnabled=true


logging.level.io.github.resilience4j=DEBUG
eureka.instance.prefer-ip-address=true

# Sample 100% of requests (Use 0.1 / 10% in high-scale production)
management.tracing.sampling.probability=1.0

# Zipkin server URL
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Custom log pattern to output [app-name, traceId, spanId]
logging.pattern.level=%5p [%${spring.application.name:},%X{traceId:-},%X{spanId:-}]